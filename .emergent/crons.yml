crons:
  - name: nightly-backup
    description: "Daily 2 AM IST — generates a full DB backup, stores it, emails SuperAdmin a notice"
    cron: "0 2 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/nightly-backup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: stock-reconcile
    description: "Daily 11:30 PM IST stock check (Opening + GRN - DPR vs physical); blocks indents if variance > 5%"
    cron: "30 23 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/stock-reconcile"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
